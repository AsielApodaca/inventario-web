<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Componentes Inventario</title>
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <style>
    main {
      padding: 2rem;
      background: #f9fafb;
      min-height: calc(100vh - 64px);
    }
  </style>
</head>
<body style="display: flex; margin: 0;">
  <app-sidebar></app-sidebar>
  <div style="flex: 1;">
    <app-header></app-header>
    <main id="main-content">
      <!-- El contenido se cargará dinámicamente aquí -->
      <dashboard-mfe></dashboard-mfe>
    </main>
  </div>

  <!-- Axios CDN - DEBE IR PRIMERO -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- API Client -->
  <script type="module" src="services/api/apiClient.js"></script>
  
  <!-- Servicios -->
  <script type="module" src="services/productService.js"></script>
  <script type="module" src="services/movementService.js"></script>
  <script type="module" src="services/warehouseService.js"></script>
  <script type="module" src="services/supplierService.js"></script>
  
  <!-- Componentes principales -->
  <script type="module" src="components/app-header.js"></script>
  <script type="module" src="components/app-sidebar.js"></script>
  
  <!-- MFEs -->
  <script type="module" src="mfes/dashboard-mfe.js"></script>
  <script type="module" src="mfes/movements-mfe.js"></script>
  <script type="module" src="mfes/warehouses-mfe.js"></script>
  <script type="module" src="mfes/suppliers-mfe.js"></script>

  <!-- Navegación entre MFEs -->
  <script type="module">
    const mainContent = document.getElementById('main-content');

    window.addEventListener('navigate', (e) => {
      const route = e.detail.route;
      
      mainContent.innerHTML = '';
      
      switch(route) {
        case 'dashboard':
          mainContent.innerHTML = '<dashboard-mfe></dashboard-mfe>';
          break;
        case 'movements':
          mainContent.innerHTML = '<movements-mfe></movements-mfe>';
          break;
        case 'warehouses':
          mainContent.innerHTML = '<warehouses-mfe></warehouses-mfe>';
          break;
        case 'suppliers':
          mainContent.innerHTML = '<suppliers-mfe></suppliers-mfe>';
          break;
        case 'settings':
          mainContent.innerHTML = '<h2>Settings</h2><p>Settings page coming soon...</p>';
          break;
        case 'logout':
          if(confirm('¿Estás seguro que quieres cerrar sesión?')) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
          }
          break;
        default:
          mainContent.innerHTML = '<h2>Página no encontrada</h2>';
      }
    });
  </script>
</body>
</html>
